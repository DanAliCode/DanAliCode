name: Update Profile README Assets

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/profile-assets.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile SVG assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: DanAliCode
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import date, timedelta
          from pathlib import Path
          from xml.sax.saxutils import escape

          username = os.environ["GH_USERNAME"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "github-profile-readme-assets"
          }

          def github_get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          user = github_get(f"https://api.github.com/users/{username}")
          followers = user.get("followers", 0)
          public_repos = user.get("public_repos", 0)

          since = (date.today() - timedelta(days=365)).isoformat()
          query = urllib.parse.urlencode({
              "q": f"author:{username} committer-date:>={since}",
              "per_page": "1"
          })
          commits_data = github_get(
              f"https://api.github.com/search/commits?{query}"
          )
          public_commits = commits_data.get("total_count", 0)

          output = Path("assets")
          output.mkdir(exist_ok=True)

          # Main Data & AI banner
          banner = """<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
          <title id="title">Danilo Ali — Data Engineering and AI</title>
          <desc id="desc">A technology banner about data engineering, cloud, big data and artificial intelligence.</desc>
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#07111f"/>
              <stop offset="1" stop-color="#102b3a"/>
            </linearGradient>
            <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#2dd4bf"/>
              <stop offset="1" stop-color="#60a5fa"/>
            </linearGradient>
            <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
              <path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-opacity=".08" stroke-width="1"/>
            </pattern>
          </defs>
          <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
          <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
          <circle cx="1030" cy="80" r="150" fill="#2dd4bf" opacity=".06"/>
          <circle cx="1110" cy="245" r="115" fill="#60a5fa" opacity=".07"/>
          <g fill="none" stroke="url(#accent)" stroke-width="2" opacity=".7">
            <path d="M835 72h80l35 35h90"/>
            <path d="M835 142h125l35-35h75"/>
            <path d="M835 212h75l35-35h125"/>
            <circle cx="835" cy="72" r="5" fill="#2dd4bf"/>
            <circle cx="835" cy="142" r="5" fill="#2dd4bf"/>
            <circle cx="835" cy="212" r="5" fill="#2dd4bf"/>
            <circle cx="1040" cy="107" r="5" fill="#60a5fa"/>
            <circle cx="1070" cy="107" r="5" fill="#60a5fa"/>
            <circle cx="1070" cy="177" r="5" fill="#60a5fa"/>
          </g>
          <g font-family="Inter,Segoe UI,Arial,sans-serif">
            <text x="72" y="91" fill="#e2e8f0" font-size="19" letter-spacing="4">DATA • CLOUD • INTELLIGENCE</text>
            <text x="68" y="157" fill="#ffffff" font-size="58" font-weight="750">Danilo Ali</text>
            <rect x="72" y="179" width="92" height="4" rx="2" fill="url(#accent)"/>
            <text x="72" y="220" fill="#cbd5e1" font-size="23" font-weight="600">Data Engineer | Cloud, Big Data &amp; AI</text>
            <text x="72" y="257" fill="#94a3b8" font-size="15" letter-spacing="1.5">BUILDING DATA PLATFORMS FOR WHAT COMES NEXT</text>
          </g>
          </svg>"""

          # Compact custom statistics card
          cards = [
              ("FOLLOWERS", f"{followers:,}", "GITHUB COMMUNITY"),
              ("PUBLIC COMMITS", f"{public_commits:,}", "LAST 12 MONTHS"),
              ("PUBLIC REPOS", f"{public_repos:,}", "OPEN SOURCE WORK"),
          ]
          card_svg = [
              '<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="title">',
              '<title id="title">GitHub profile statistics</title>',
              '<defs><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient></defs>',
              '<rect width="1000" height="190" rx="18" fill="#0b1726" stroke="#1e3a4b"/>'
          ]
          for i, (label, value, sub) in enumerate(cards):
              x = 22 + i * 326
              card_svg.append(
                  f'<rect x="{x}" y="18" width="306" height="154" rx="13" fill="#102235" stroke="#244154"/>'
                  f'<rect x="{x}" y="18" width="306" height="3" rx="1.5" fill="url(#line)"/>'
                  f'<text x="{x+22}" y="56" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">{escape(label)}</text>'
                  f'<text x="{x+22}" y="112" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="43" font-weight="750">{escape(value)}</text>'
                  f'<text x="{x+22}" y="145" fill="#2dd4bf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="1.2">{escape(sub)}</text>'
              )
          card_svg.append("</svg>")

          (output / "data-ai-banner.svg").write_text(banner, encoding="utf-8")
          (output / "profile-stats.svg").write_text("".join(card_svg), encoding="utf-8")
          print(f"Generated assets for {username}: {followers} followers, {public_commits} public commits, {public_repos} public repos.")
          PY

      - name: Commit updated SVG assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update profile README assets"
          file_pattern: "assets/*.svg"
